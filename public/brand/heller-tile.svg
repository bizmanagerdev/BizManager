<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="BizH">
  <title>BizH</title>
  <!-- THE INSTALLED APP ICON — secondary sky on primary navy, as a filled tile.
       Separate from app/icon.svg (the transparent tab icon) because a home screen
       and an apple-touch icon need an opaque square: iOS composites a transparent
       PNG onto BLACK, and Android's maskable crop needs bleed to cut into.
       The mark runs at 64% of the canvas so the three chevrons still separate at
       small sizes: 100 x 90.92 scaled 1.64 => 164 x 149.1, centred.
       Raster icons are generated from this file — scripts/gen-app-icons.mjs. -->
  <rect width="256" height="256" rx="56" fill="#0A1020"/>
  <g transform="translate(46 53.4) scale(1.64)" fill="#0369A1">
    <path d="M 99.54 31.20 L 87.41 38.81 L 49.96 15.30 L 12.40 38.88 L 0.16 31.20 L 49.85 0.00 Z"/>
    <path d="M 0.00 41.88 L 12.29 49.60 L 49.85 26.02 L 87.39 49.59 L 100.00 41.68 L 100.00 57.04 L 87.49 64.90 L 75.25 57.22 L 49.96 41.32 L 12.40 64.90 L 0.16 57.22 L 0.00 57.11 Z"/>
    <path d="M 0.00 67.90 L 12.29 75.62 L 49.85 52.04 L 87.39 75.61 L 100.00 67.70 L 100.00 83.06 L 87.49 90.92 L 75.25 83.23 L 49.96 67.33 L 12.40 90.92 L 0.16 83.23 L 0.00 83.13 Z"/>
