name: CI

# Fast quality gate on every push and PR. Keeps process ahead of features:
# a regression in typecheck, lint, or the test suite blocks the merge instead
# of shipping silently. `verify` needs no secrets or database; `money-access`
# starts a database of its own. Production waits for both (Vercel's Deployment
# Checks); the slower, flakier e2e job doesn't hold it back.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: DB schema policy (db/sql frozen)
        run: npm run db:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        # A test that fails is tried once more before it counts: one slow test
        # on a busy runner shouldn't hold production back. Twice is real.
        run: npm test -- --retry=1

  money-access:
    name: worker money access
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The worker money check (__tests__/security/rls-live.test.ts) on a
    # database of its own, built from the migrations as e2e's is, with only
    # what it needs (database, logins, API) — no app build, no browser, so it
    # stays quick enough for production to wait on. It checks the access rules
    # as the migrations write them, not changes made by hand on the live one.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: New tables get the grants they get on the live database
        # The live database gives every new table, function and sequence to the
        # API's roles (its default privileges); the CLI's local stack no longer
        # does unless asked, so tables made by later migrations (ledger checks,
        # among others) were refused even to the service role. The access rules
        # decide who sees what, as on live. CI only; the CLI is locked at 2.107.
        run: |
          sed -i 's/^# auto_expose_new_tables = true/auto_expose_new_tables = true/' supabase/config.toml
          grep -n '^auto_expose_new_tables = true' supabase/config.toml

      - name: Start the database
        # From Docker Hub when public.ecr.aws refuses the download (see e2e).
        run: |
          set +e
          EXCLUDE=analytics,edge-runtime,functions,imgproxy,inbucket,meta,realtime,storage,studio,vector
          npx supabase start --yes -x "$EXCLUDE" > /tmp/supabase.txt 2>&1
          STATUS=$?
          if [ $STATUS -ne 0 ] && grep -qiE "toomanyrequests|failed to pull docker image" /tmp/supabase.txt; then
            echo "::warning::public.ecr.aws refused the Supabase image download; starting again from Docker Hub."
            npx supabase stop --no-backup > /dev/null 2>&1
            export SUPABASE_INTERNAL_IMAGE_REGISTRY=docker.io
            npx supabase start --yes -x "$EXCLUDE" > /tmp/supabase.txt 2>&1
            STATUS=$?
          fi
          if [ $STATUS -ne 0 ]; then
            tail -c 20000 /tmp/supabase.txt
            LINES=$(tail -n 30 /tmp/supabase.txt | cut -c1-300 | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=supabase start failed::$LINES"
          fi
          exit $STATUS

      - name: TRIAL ONLY - open the accounts to every signed-in person
        run: psql -v ON_ERROR_STOP=1 "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -c "create policy ci_trial_leak on public.accounts for select to authenticated using (true);"

      - name: Check who can see the money
        run: |
          STATUS_ENV=$(npx supabase status -o env)
          get_val() {
            echo "$STATUS_ENV" | grep -E "^($1)=" | head -1 | cut -d= -f2- | tr -d '"'
          }
          export RLS_TEST_URL=$(get_val "API_URL|PROJECT_URL")
          export RLS_TEST_ANON_KEY=$(get_val "ANON_KEY|PUBLISHABLE_KEY")
          export RLS_TEST_SERVICE_KEY=$(get_val "SERVICE_ROLE_KEY|SECRET_KEY")
          # Without them the test would skip, and a skip reads as a pass.
          if [ -z "$RLS_TEST_URL" ] || [ -z "$RLS_TEST_ANON_KEY" ] || [ -z "$RLS_TEST_SERVICE_KEY" ]; then
            echo "::error::Could not read the local database's address and keys from 'supabase status -o env'."
            exit 1
          fi
          npx vitest run __tests__/security/rls-live.test.ts

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    # baseline.sql + the full ~132-migration chain after it now replays with
    # zero errors from a totally fresh database - verified twice directly
    # against Postgres (see foundation-hardening memory for the fix list:
    # missing tables/columns/extension, a function-ordering bug, several
    # CREATE POLICY statements missing their drop-first idempotency guard,
    # a couple of CREATE OR REPLACE VIEW/FUNCTION statements superseded by
    # baseline's now-current capture, and 2 tables baseline still had that
    # production had already dropped). continue-on-error is gone accordingly.
    #
    # That verification used a bare-Postgres harness with minimal stand-in
    # auth/storage schemas (this dev machine's Docker is broken, so a real
    # `supabase start` couldn't be run locally) - this job's own real
    # `supabase start`, with Supabase's actual auth/storage schemas, is the
    # first genuine end-to-end confirmation. Watch the first run after this
    # lands; if something surfaces here that the stand-in schemas couldn't
    # catch, re-add continue-on-error while it's fixed rather than leaving
    # every push blocked on it.
    # Needed for the failure-diagnostic step to post a commit comment with
    # GITHUB_TOKEN — repos default to a read-only token otherwise, which
    # would make that POST fail (silently, since plain curl doesn't treat
    # a 4xx response as a shell error — fixed below too by capturing and
    # printing the actual response).
    permissions:
      contents: write
    # Separate job, not a step in `verify` — keeps the fast static/unit gate
    # fast (its own comment above says "no secrets/DB needed" on purpose)
    # while this runs in parallel with its own real (if slower) local stack.
    # ubuntu-latest ships Docker pre-installed and running, so `supabase
    # start` needs no setup here — unlike a Windows/WSL2 dev machine, where
    # Docker Desktop's WSL2 backend can fail for reasons unrelated to this
    # repo (confirmed while adding this: see e2e/README.md's own note this
    # stack is local-only).
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Docker sanity check
        # Cheap, fast check of the runner's own Docker before blaming
        # Supabase for anything — rules this out as a variable.
        run: |
          docker version
          docker ps

      - name: Enable storage for this CI run only
        # supabase/config.toml keeps storage off so local dev stays light;
        # the documents upload E2E test needs it, so it's switched on here
        # for the CI stack alone. Bucket + policy are created after start.
        run: |
          sed -i '/^\[storage\]/,/^enabled/ s/^enabled = false/enabled = true/' supabase/config.toml
          grep -n -A 3 '^\[storage\]' supabase/config.toml

      - name: Start local Supabase stack
        # --yes: a bare `supabase start` can hit a confirmation prompt (e.g.
        # first-time image pull) — with no TTY on a CI runner that fails
        # immediately instead of hanging, which matches the fast (~1m25s
        # total job) failure seen the first time this ran without it.
        #
        # Two prior attempts both failed in ~1m25s with no visible cause
        # (repo owner couldn't access the raw per-line logs, which need a
        # signed-in collaborator even on a public repo — different from this
        # step summary, which renders on the run's Summary page for anyone).
        # --debug + capturing stdout/stderr separately here, written to
        # $GITHUB_STEP_SUMMARY on failure, is how to actually see why
        # without needing log access.
        #
        # Deliberately NOT `-o json` here (that flag exists on `start` per
        # --help, but doesn't actually apply to its own summary output in
        # this CLI version - it silently still prints the plain banner).
        # Credentials are read afterward via `supabase status -o env`
        # instead, which the CLI genuinely honors - see the next step.
        #
        # The CLI pulls its images from public.ecr.aws, whose anonymous
        # download allowance is shared by the runners' addresses: runs #677
        # and #679 (2026-10-16) died on "toomanyrequests: Data limit
        # exceeded" before any test ran. When a pull is refused like that,
        # start once more from Docker Hub instead — the CLI's own
        # SUPABASE_INTERNAL_IMAGE_REGISTRY=docker.io switch (read by CLI
        # 2.107.0, which pulls "supabase/<image>" from there). Any other
        # failure is reported as before.
        run: |
          set +e
          npx supabase start --yes --debug > /tmp/supabase-stdout.txt 2> /tmp/supabase-stderr.txt
          STATUS=$?
          if [ $STATUS -ne 0 ] && grep -qiE "toomanyrequests|failed to pull docker image" /tmp/supabase-stdout.txt /tmp/supabase-stderr.txt; then
            echo "::warning::public.ecr.aws refused the Supabase image download; starting again from Docker Hub."
            npx supabase stop --no-backup > /dev/null 2>&1
            export SUPABASE_INTERNAL_IMAGE_REGISTRY=docker.io
            echo "SUPABASE_INTERNAL_IMAGE_REGISTRY=docker.io" >> "$GITHUB_ENV"
            npx supabase start --yes --debug > /tmp/supabase-stdout.txt 2> /tmp/supabase-stderr.txt
            STATUS=$?
          fi
          if [ $STATUS -ne 0 ]; then
            {
              echo "### supabase start failed (exit $STATUS)"
              echo '#### stdout'
              echo '```'
              tail -c 20000 /tmp/supabase-stdout.txt
              echo '```'
              echo '#### stderr'
              echo '```'
              tail -c 20000 /tmp/supabase-stderr.txt
              echo '```'
              echo '#### docker ps -a'
              echo '```'
              docker ps -a
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $STATUS

      - name: Post failure details as a commit comment
        # Primary diagnostic path — both raw logs AND artifact downloads
        # redirect to Azure Blob Storage, which this specific dev machine's
        # network can't reach (a documented pre-existing TLS issue, unrelated
        # to this repo). A commit comment stays entirely on api.github.com,
        # which IS reachable, and is readable by anyone (even unauthenticated)
        # on a public repo — the actual fix for being unable to see this at all.
        if: failure()
        run: |
          BODY=$(
            {
              echo "### e2e (playwright) — supabase start failed"
              echo '#### stdout'
              echo '```'
              tail -c 20000 /tmp/supabase-stdout.txt
              echo '```'
              echo '#### stderr'
              echo '```'
              tail -c 20000 /tmp/supabase-stderr.txt
              echo '```'
              echo '#### docker ps -a'
              echo '```'
              docker ps -a
              echo '```'
            } | jq -Rs .
          )
          curl -s -w "\nHTTP status: %{http_code}\n" -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -d "{\"body\": $BODY}"

      - name: Upload supabase start output
        # Backup path in case the step summary above (rendered on the run's
        # Summary page) isn't visible either — artifact downloads sometimes
        # have different access rules than the raw per-line log stream.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-start-output
          path: |
            /tmp/supabase-stdout.txt
            /tmp/supabase-stderr.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: Write .env.test.local from the local stack's own credentials
        # Previously parsed `supabase start`'s own stdout with `jq -r .API_URL`
        # etc, assuming `-o json` made it print JSON there - it doesn't (see
        # the previous step's comment), so every extraction silently returned
        # nothing and every single Playwright test failed downstream with a
        # confusing 30s navigation timeout, several minutes away from the
        # actual cause. `supabase status -o env` is what the CLI genuinely
        # supports for this (its own --help even shows an `--override-name`
        # example), so ask it directly instead of scraping `start`'s banner.
        #
        # Grep, not a fixed key name: this CLI version renamed the local
        # anon/service_role keys to "publishable"/"secret" (a real Supabase
        # platform change), and status var names have shifted between CLI
        # versions before - so match liberally (old and new naming) rather
        # than hardcode one, and fail LOUDLY with the full raw output if a
        # value still comes up empty instead of writing a broken file that
        # fails silently and confusingly downstream.
        run: |
          set +e
          STATUS_ENV=$(npx supabase status -o env)
          set -e

          get_val() {
            echo "$STATUS_ENV" | grep -E "^($1)=" | head -1 | cut -d= -f2-
          }

          URL=$(get_val "API_URL|PROJECT_URL")
          ANON_KEY=$(get_val "ANON_KEY|PUBLISHABLE_KEY")
          SERVICE_KEY=$(get_val "SERVICE_ROLE_KEY|SECRET_KEY")

          if [ -z "$URL" ] || [ -z "$ANON_KEY" ] || [ -z "$SERVICE_KEY" ]; then
            echo "::error::Could not extract one or more Supabase local credentials from 'supabase status -o env'. Raw output (local throwaway dev-stack keys only, safe to show):"
            echo "$STATUS_ENV"
            exit 1
          fi

          echo "NEXT_PUBLIC_SUPABASE_URL=$URL" >> .env.test.local
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> .env.test.local
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_KEY" >> .env.test.local

      - name: Build the app
        id: build
        # Runs the e2e suite against a real production build instead of
        # `next dev` — see playwright.config.ts's webServer comment for the
        # full story: four separate attempts at patching around dev mode's
        # on-demand compilation + Fast Refresh remounting all failed to fix
        # an "element was detached from the DOM" instability broad enough
        # (including plain nav-redirect tests touching no dialog at all) to
        # point at this runner's own resource pressure — a standard 2-core
        # box running Postgres + a live-compiling dev server + a full browser
        # all at once — rather than any single interaction. A finished build
        # has none of that live-compilation machinery, and building here (no
        # tests/browser running yet) means it isn't competing for CPU either.
        #
        # NEXT_PUBLIC_E2E_TEST=1 tells PwaRegistration.tsx to skip Service
        # Worker registration — confirmed via a real CI run's captured
        # console/network output (a mass net::ERR_ABORTED across every nav
        # link's prefetch plus an "Unexpected token '<'" pageerror) that
        # sw.js's own IS_DEV_HOST guard matches this runner's 127.0.0.1 host,
        # self-destructs, and force-navigates every open tab the instant it
        # activates — mid-test. Right behavior for a real dev machine, wrong
        # for a from-scratch e2e build with nothing stale to clean up. See
        # PwaRegistration.tsx's own comment for the full account. The offline
        # test (its own step below) reaches this same build on a .test name,
        # where the worker does register and runs as in production.
        #
        # NEXT_PUBLIC_POWERSYNC_URL: an address where nothing listens. Unset,
        # the build syncs with the real PowerSync server, which replicates the
        # live database — it refuses the test logins, but CI shouldn't reach
        # it at all. Either way the device copy never syncs here, so the device
        # pages come as their server version, as before. The device copy test
        # further down gets a build of its own, with a sync server of its own.
        #
        # NEXT_PUBLIC_* vars must be present at BUILD time to get baked into
        # the client bundle, so .env.test.local (written by the previous
        # step) is sourced into this step's own shell — these are throwaway
        # local-stack credentials scoped to this one job run, not secrets
        # other steps need, so no reason to promote them via $GITHUB_ENV.
        run: |
          set -a
          source .env.test.local
          set +a
          NEXT_PUBLIC_E2E_TEST=1 NEXT_PUBLIC_POWERSYNC_URL=http://127.0.0.1:9 npm run build
        timeout-minutes: 10

      - name: Install Playwright's chromium
        run: npx playwright install --with-deps chromium

      - name: Grant service_role read on auth.users (CI-only local stack)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -c "GRANT SELECT ON auth.users TO service_role;"

      - name: Create the documents bucket and a staff storage policy (CI-only local stack)
        # Production's admin/office policies on storage.objects were made by
        # hand in the dashboard and never captured in a migration, so the
        # local stack has none. This stand-in only exists in the CI database.
        run: |
          psql -v ON_ERROR_STOP=1 "postgresql://postgres:postgres@127.0.0.1:54322/postgres" <<'SQL'
          insert into storage.buckets (id, name, public)
          values ('business-documents', 'business-documents', false)
          on conflict (id) do nothing;

          drop policy if exists ci_staff_business_documents on storage.objects;
          create policy ci_staff_business_documents on storage.objects
          for all to authenticated
          using (
            bucket_id = 'business-documents'
            and exists (
              select 1 from public.users u
              where u.auth_user_id = auth.uid()
                and u.role in ('admin', 'office')
                and u.active = true
                and coalesce(u.system_access, false) = true
            )
          )
          with check (
            bucket_id = 'business-documents'
            and exists (
              select 1 from public.users u
              where u.auth_user_id = auth.uid()
                and u.role in ('admin', 'office')
                and u.active = true
                and coalesce(u.system_access, false) = true
            )
          );
          SQL

      - name: Run E2E tests
        id: e2e
        run: npm run test:e2e -- --project=chromium --project=mobile

      - name: Upload Playwright report on failure
        if: ${{ !cancelled() && steps.e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Run the offline test
        # The app with the service worker running and the network switched off
        # mid-test (e2e/offline-pages.spec.ts — every offline bug of Oct 24–27
        # was found only by hand). Its own step, so its result reads apart from
        # the rest of the suite, and it runs even when the rest failed.
        id: offline
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:e2e -- --project=offline
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-offline

      - name: Upload the offline test's report on failure
        if: ${{ !cancelled() && steps.offline.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-offline
          path: playwright-report-offline/
          retention-days: 7

      - name: Start a PowerSync server on the test database
        # For the device copy test (e2e/offline-device-copy.spec.ts): the app
        # with its copy of the data really syncing, as on the office's phones.
        # The real PowerSync server replicates the live database and can't
        # check the test logins, so CI runs its own — the open-source server,
        # reading this job's local database. The migrations already made its
        # "powersync" publication and powersync_role there, as on the live one;
        # the role gets a password for this run only. The server keeps its own
        # data in a second database on the same Postgres, checks logins the
        # way the local stack signs them, and syncs powersync/sync-config.yaml
        # as it is. Ends by asking it for the admin's data with a real login,
        # so a server that can't sync stops here, saying why.
        id: powersync
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          set -a
          source .env.test.local
          set +a
          DB="postgresql://postgres:postgres@127.0.0.1:54322"
          # A role with replication rights may only be changed by one that
          # has them and made it: else the local stack's own admin login.
          SET_PASSWORD="ALTER ROLE powersync_role WITH LOGIN PASSWORD 'ci-powersync';"
          psql -v ON_ERROR_STOP=1 "$DB/postgres" -c "$SET_PASSWORD" \
            || psql -v ON_ERROR_STOP=1 "postgresql://supabase_admin:postgres@127.0.0.1:54322/postgres" -c "$SET_PASSWORD"
          psql -v ON_ERROR_STOP=1 "$DB/postgres" -c "CREATE DATABASE powersync_storage;"

          # A real login, to see how the local stack signs them.
          TOKEN=$(curl -sf "$NEXT_PUBLIC_SUPABASE_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $NEXT_PUBLIC_SUPABASE_ANON_KEY" -H "Content-Type: application/json" \
            -d '{"email":"e2e-admin@bizh.test","password":"e2e-test-password-123"}' | jq -r .access_token)
          ALG=$(node -e 'console.log(JSON.parse(Buffer.from(process.argv[1].split(".")[0], "base64url")).alg)' "$TOKEN")
          echo "The local stack signs logins with $ALG."
          if [ "$ALG" = "HS256" ]; then
            JWT_SECRET=$(npx supabase status -o env | grep -E '^JWT_SECRET=' | head -1 | cut -d= -f2- | tr -d '"')
            AUTH="  supabase_jwt_secret: \"$JWT_SECRET\""
          else
            AUTH="  jwks_uri: $NEXT_PUBLIC_SUPABASE_URL/auth/v1/.well-known/jwks.json"
          fi

          mkdir -p ci-powersync
          cp powersync/sync-config.yaml ci-powersync/sync-config.yaml
          cat > ci-powersync/service.yaml <<YAML
          telemetry:
            disable_telemetry_sharing: true
          replication:
            connections:
              - type: postgresql
                uri: postgresql://powersync_role:ci-powersync@127.0.0.1:54322/postgres
                sslmode: disable
          storage:
            type: postgresql
            uri: $DB/powersync_storage
            sslmode: disable
          port: 8080
          sync_config:
            path: sync-config.yaml
          client_auth:
            supabase: true
          $AUTH
            audience: ["authenticated"]
          YAML

          docker run -d --name powersync --network host \
            -v "$PWD/ci-powersync:/config:ro" \
            -e POWERSYNC_CONFIG_PATH=/config/service.yaml \
            -e PS_LOG_FORMAT=text \
            -e NODE_OPTIONS=--max-old-space-size=1000 \
            journeyapps/powersync-service:1.27 start -r unified

          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/probes/liveness > /dev/null; then break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' powersync)" != "true" ]; then
              echo "::error::The PowerSync server stopped while starting."
              exit 1
            fi
            sleep 2
          done

          # The admin's data, as the app asks for it: the first lines name a
          # checkpoint once the server has read the database through.
          for i in $(seq 1 12); do
            curl -s -N --max-time 10 -X POST http://127.0.0.1:8080/sync/stream \
              -H "Authorization: Token $TOKEN" -H "Content-Type: application/json" \
              -d '{"buckets":[],"include_checksum":true,"raw_data":true,"streams":{"include_defaults":true,"subscriptions":[]}}' \
              > /tmp/powersync-stream.txt || true
            if grep -q '"checkpoint' /tmp/powersync-stream.txt; then
              echo "The PowerSync server syncs the admin's data."
              head -c 600 /tmp/powersync-stream.txt; echo
              exit 0
            fi
            sleep 5
          done
          echo "::error title=PowerSync server::It didn't sync the admin's data. Its answer: $(head -c 600 /tmp/powersync-stream.txt | tr '\n' ' ')"
          exit 1
        timeout-minutes: 5

      - name: Build the app again, syncing with that server
        # This build only for the device copy test: the tests above keep the
        # one built at the start.
        id: build-copy
        if: ${{ !cancelled() && steps.powersync.outcome == 'success' }}
        run: |
          set -a
          source .env.test.local
          set +a
          NEXT_PUBLIC_E2E_TEST=1 NEXT_PUBLIC_POWERSYNC_URL=http://127.0.0.1:8080 npm run build
        timeout-minutes: 10

      - name: Run the device copy offline test
        id: offline-copy
        if: ${{ !cancelled() && steps.build-copy.outcome == 'success' }}
        run: npm run test:e2e -- --project=offline-copy
        env:
          E2E_POWERSYNC: "1"
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-offline-copy

      - name: The PowerSync server's log on failure
        # As an annotation too: it reads on the run's page, where the raw log
        # needs a signed-in collaborator.
        if: ${{ !cancelled() && (steps.powersync.outcome == 'failure' || steps.offline-copy.outcome == 'failure') }}
        run: |
          docker logs powersync > /tmp/powersync.log 2>&1 || true
          tail -n 80 /tmp/powersync.log
          LINES=$(tail -n 40 /tmp/powersync.log | cut -c1-300 | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::warning title=PowerSync server log (last 40 lines)::$LINES"

      - name: Upload the device copy test's report and the server's log on failure
        if: ${{ !cancelled() && (steps.powersync.outcome == 'failure' || steps.offline-copy.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-offline-copy
          path: |
            playwright-report-offline-copy/
            /tmp/powersync.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop local Supabase stack
        if: always()
        run: |
          docker rm -f powersync > /dev/null 2>&1 || true
          npx supabase stop
