<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>BizH</title>
    <style>
      /* The app's no-signal page (capacitor.config.ts server.errorPath): shown when
         neither the site nor its offline copy loads. Same look as the opening
         screen: the phone dashboard's light blue and the blue mark. */
      html, body {
        height: 100%;
        margin: 0;
        background: #ecf5fe;
        color: #0a1020;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Hebrew", Arial, sans-serif;
      }
      .wrap {
        min-height: 100%;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        text-align: center;
      }
      svg { width: 96px; height: auto; fill: #0369a1; margin-bottom: 8px; }
      h1 { font-size: 22px; margin: 0; }
      p { font-size: 16px; line-height: 1.5; color: #3d4b63; margin: 0; max-width: 320px; }
      button {
        margin-top: 10px;
        font: inherit;
        font-size: 17px;
        font-weight: 600;
        color: #ffffff;
        background: #0369a1;
        border: 0;
        border-radius: 12px;
        padding: 12px 28px;
      }
      button:active { opacity: 0.85; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <svg viewBox="0 0 100 90.92" aria-hidden="true">
        <path d="M 99.54 31.20 L 87.41 38.81 L 49.96 15.30 L 12.40 38.88 L 0.16 31.20 L 49.85 0.00 Z" />
        <path d="M 0.00 41.88 L 12.29 49.60 L 49.85 26.02 L 87.39 49.59 L 100.00 41.68 L 100.00 57.04 L 87.49 64.90 L 75.25 57.22 L 49.96 41.32 L 12.40 64.90 L 0.16 57.22 L 0.00 57.11 Z" />
        <path d="M 0.00 67.90 L 12.29 75.62 L 49.85 52.04 L 87.39 75.61 L 100.00 67.70 L 100.00 83.06 L 87.49 90.92 L 75.25 83.23 L 49.96 67.33 L 12.40 90.92 L 0.16 83.23 L 0.00 83.13 Z" />
      </svg>
      <h1>אין חיבור לאינטרנט</h1>
      <p>BizH צריכה חיבור כדי להיפתח בפעם הזאת. כשהחיבור יחזור, לחצו על "נסו שוב".</p>
      <button type="button" onclick="location.replace('/dashboard')">נסו שוב</button>
    </div>
    <script>
      // Try again by itself as soon as the phone is back online.
      window.addEventListener("online", function () {
        location.replace("/dashboard");
      });
    </script>
  </body>
</html>
