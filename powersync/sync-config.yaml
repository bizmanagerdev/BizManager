# BizManager — PowerSync Sync Streams, v1.9 (2026-10-09): each person's own
# task snoozes ("לטיפול בהמשך" — task_snoozes), and the task reminders already
# marked done (a far-off task their reminder brought onto the board stays on
# it once the reminder is done — lib/tasks/visibility.ts).
# v1.8 (2026-10-07): the dashboard's
# money cards from the device — staff also get loans and their repayments,
# card statement charges, the card statement lines tied to an expense, card
# settlement confirmations, the payment sources' settings, every recurring
# bill's rule and the books start date.
# v1.7 (2026-10-07): a project's page
# from the device — staff also get users' login ids (who entered what), the
# account names, the VAT rate and the recurring bills' names.
# v1.6 (2026-10-07): workers added.
#
# The signed-in person's role is looked up in public.users by their Supabase
# login id (users.id differs from the login id for some people). The first
# streams are for admins and office (staff_gate / staff_me); the worker_*
# streams at the end are workers' own share — no more than the server's RLS
# already lets a worker read.
#
# Gate pattern: `FROM <table>, staff_gate AS bucket` — the row syncs only when
# the lookup returns a row, and all admins share one bucket (keyed by role).
# (This PowerSync version supports neither EXISTS nor `IN ('a', 'b')` lists —
# hence the chains of `!=` below.) `IN (SELECT ...)` subqueries, nested too,
# give each person their own rows.
#
# Source of truth: powersync/sync-config.yaml in the repo. Paste the whole file
# into the PowerSync dashboard (Sync Streams) and deploy.

config:
  edition: 3

with:
  staff_gate: SELECT role FROM users WHERE auth_user_id = auth.user_id() AND active = true AND system_access = true AND (role = 'admin' OR role = 'office')
  # The signed-in staff member's own users.id.
  staff_me: SELECT id FROM users WHERE auth_user_id = auth.user_id() AND active = true AND system_access = true AND (role = 'admin' OR role = 'office')
  # The signed-in worker's own users.id, and a one-row gate for all workers
  # (same conditions as current_app_user_id(): active, may sign in).
  worker_me: SELECT id FROM users WHERE auth_user_id = auth.user_id() AND active = true AND system_access = true AND role = 'worker'
  worker_gate: SELECT role FROM users WHERE auth_user_id = auth.user_id() AND active = true AND system_access = true AND role = 'worker'
  # Workers whose deliveries section isn't switched off — it's on unless set
  # to false (lib/auth/sections.ts sanitizeSectionAccess).
  worker_deliveries_gate: SELECT role FROM users WHERE auth_user_id = auth.user_id() AND active = true AND system_access = true AND role = 'worker' AND (section_access IS NULL OR section_access ->> 'deliveries' IS NULL OR section_access ->> 'deliveries' != false)

streams:
  # Names and colours of everyone, plus what the staff screens show
  # (notification_prefs: the alerts card hides the topics a person muted;
  # auth_user_id: some rows record who entered them by login id).
  people:
    auto_subscribe: true
    query: |
      SELECT users.id, users.full_name, users.email, users.phone, users.avatar_color,
             users.role, users.active, users.system_access, users.locale, users.notification_prefs,
             users.pay_tracking_mode, users.payroll_worker_type, users.auth_user_id
      FROM users, staff_gate AS bucket

  tasks:
    auto_subscribe: true
    queries:
      - SELECT tasks.* FROM tasks, staff_gate AS bucket WHERE tasks.is_private = false
      - SELECT * FROM tasks WHERE is_private = true AND private_owner_id IN staff_me
      - |
        SELECT task_members.task_id || ':' || task_members.user_id AS id,
               task_members.task_id, task_members.user_id, task_members.created_at
        FROM task_members, staff_gate AS bucket
      # Comments, exactly like their task: not private, or the person's own
      # private task. Each comment carries a copy of its task's privacy
      # (task_is_private, task_private_owner_id — kept up to date by triggers),
      # because a stream can't look the task up per comment.
      - SELECT task_comments.* FROM task_comments, staff_gate AS bucket WHERE task_comments.task_is_private = false
      - SELECT * FROM task_comments WHERE task_is_private = true AND task_private_owner_id IN staff_me
      # The person's own snoozed tasks ("לטיפול בהמשך" — per person).
      - SELECT * FROM task_snoozes WHERE user_id IN staff_me

  # Every open reminder: admins and office read them all in the app too (the
  # alerts list picks its own; the task cards' bell looks at any on the task).
  reminders:
    auto_subscribe: true
    queries:
      - SELECT reminders.* FROM reminders, staff_gate AS bucket WHERE reminders.status = 'pending'
      # Task reminders already done: a far-off task its reminder brought onto
      # the board stays there afterwards.
      - SELECT reminders.* FROM reminders, staff_gate AS bucket WHERE reminders.status = 'done' AND reminders.task_id IS NOT NULL

  business:
    auto_subscribe: true
    queries:
      - SELECT projects.* FROM projects, staff_gate AS bucket
      - SELECT orders.* FROM orders, staff_gate AS bucket
      - |
        SELECT order_delivery_recipients.order_id || ':' || order_delivery_recipients.user_id AS id,
               order_delivery_recipients.order_id, order_delivery_recipients.user_id,
               order_delivery_recipients.created_at
        FROM order_delivery_recipients, staff_gate AS bucket
      - SELECT customers.* FROM customers, staff_gate AS bucket
      - SELECT customer_branches.* FROM customer_branches, staff_gate AS bucket
      - SELECT order_items.* FROM order_items, staff_gate AS bucket
      - SELECT products.* FROM products, staff_gate AS bucket
      - |
        SELECT inventory.product_id AS id, inventory.product_id, inventory.quantity_on_hand,
               inventory.quantity_reserved, inventory.updated_at
        FROM inventory, staff_gate AS bucket
      - SELECT payments.* FROM payments, staff_gate AS bucket
      - SELECT phone_attendance_reports.* FROM phone_attendance_reports, staff_gate AS bucket
      - SELECT attendance_sessions.* FROM attendance_sessions, staff_gate AS bucket
      - SELECT properties.* FROM properties, staff_gate AS bucket
      - SELECT lease_agreements.* FROM lease_agreements, staff_gate AS bucket
      # The money behind each project (project_financials_view and
      # worker_debt_items_view, worked out on the device). Admin and office
      # read all of these in the app too.
      - SELECT expenses.* FROM expenses, staff_gate AS bucket
      - SELECT project_expenses.* FROM project_expenses, staff_gate AS bucket
      - SELECT payslips.* FROM payslips, staff_gate AS bucket
      - SELECT payroll_periods.* FROM payroll_periods, staff_gate AS bucket
      - SELECT salary_agreements.* FROM salary_agreements, staff_gate AS bucket
      - SELECT worker_payments.* FROM worker_payments, staff_gate AS bucket
      - SELECT worker_payment_allocations.* FROM worker_payment_allocations, staff_gate AS bucket
      # The sales tabs' stock movements and product categories.
      - SELECT inventory_movements.* FROM inventory_movements, staff_gate AS bucket
      - SELECT product_categories.* FROM product_categories, staff_gate AS bucket
      # Which documents are linked to what (the tasks board's paperclip).
      - SELECT document_links.* FROM document_links, staff_gate AS bucket
      # A project's page: each movement's account by name, the VAT rate, and
      # a recurring bill's rule by name (and who set it up). Names and the
      # rate only — no balances or other settings.
      - SELECT accounts.id, accounts.name FROM accounts, staff_gate AS bucket
      # The VAT rate (a project's page) and the books start date (the money
      # chart shows nothing before it). money_tables = 1 marks a copy that has
      # the money cards' tables below — it arrives in the same complete
      # download as they do, so a device never works the cards out from a copy
      # that hasn't received them yet (lib/powersync/money-copy.ts).
      - SELECT 'true' AS id, business_settings.vat_rate, business_settings.books_start_date, 1 AS money_tables FROM business_settings, staff_gate AS bucket
      # Recurring bills: their rules — the payments card lists what's coming
      # (and when to remind), a project's page names them.
      - |
        SELECT recurring_expense_templates.id, recurring_expense_templates.template_name,
               recurring_expense_templates.created_by, recurring_expense_templates.category,
               recurring_expense_templates.amount, recurring_expense_templates.is_variable_amount,
               recurring_expense_templates.auto_paid, recurring_expense_templates.description_template,
               recurring_expense_templates.notes_template, recurring_expense_templates.business_domain,
               recurring_expense_templates.account_id, recurring_expense_templates.frequency,
               recurring_expense_templates.interval_months, recurring_expense_templates.expense_day_of_month,
               recurring_expense_templates.expense_month_of_year, recurring_expense_templates.start_date,
               recurring_expense_templates.end_date, recurring_expense_templates.created_at,
               recurring_expense_templates.is_active, recurring_expense_templates.reminder_work_days_before
        FROM recurring_expense_templates, staff_gate AS bucket
      # The dashboard's money cards (payments, collections, the income /
      # expenses chart): loans and their repayments, card statements (the
      # charges, and of the statement lines only which expense each one is),
      # card settlements already confirmed, and the payment sources' settings.
      - SELECT loans.* FROM loans, staff_gate AS bucket
      - SELECT loan_repayments.* FROM loan_repayments, staff_gate AS bucket
      - |
        SELECT card_statement_charges.id, card_statement_charges.statement_id, card_statement_charges.card_label,
               card_statement_charges.account_id, card_statement_charges.amount, card_statement_charges.charge_date,
               card_statement_charges.notes
        FROM card_statement_charges, staff_gate AS bucket
      - |
        SELECT card_statement_rows.id, card_statement_rows.expense_id, card_statement_rows.statement_id,
               card_statement_rows.card_label, card_statement_rows.category
        FROM card_statement_rows, staff_gate AS bucket
        WHERE card_statement_rows.expense_id IS NOT NULL
      - |
        SELECT card_settlement_confirmations.id, card_settlement_confirmations.account_id,
               card_settlement_confirmations.settlement_date
        FROM card_settlement_confirmations, staff_gate AS bucket
      - |
        SELECT outflow_source_settings.id, outflow_source_settings.source_kind, outflow_source_settings.source_key,
               outflow_source_settings.reminder_work_days_before, outflow_source_settings.account_id,
               outflow_source_settings.is_active
        FROM outflow_source_settings, staff_gate AS bucket

  # ── Workers (approved 2026-10-07) ──────────────────────────────────────────
  # Exactly what the server already lets a worker read (the tables' RLS
  # policies), and of that only what his dashboard and tasks pages show. A
  # worker's `users` holds just his own row, as on the server; everyone's name
  # and colour come in `user_directory` and every property's name in
  # `property_directory` — what user_directory() / property_directory() hand
  # him. A task he's a member of counts only while it isn't private
  # (task_can_access()); comments carry their task's privacy themselves.

  worker_self:
    auto_subscribe: true
    query: |
      SELECT users.id, users.full_name, users.email, users.phone, users.avatar_color,
             users.role, users.active, users.system_access, users.locale, users.notification_prefs,
             users.pay_tracking_mode, users.payroll_worker_type
      FROM users WHERE users.id IN worker_me

  worker_directory:
    auto_subscribe: true
    queries:
      - |
        SELECT "user_directory".id, "user_directory".full_name, "user_directory".avatar_color,
               "user_directory".role, "user_directory".active
        FROM users AS "user_directory", worker_gate AS bucket
      - |
        SELECT "property_directory".id, "property_directory".name, "property_directory".address,
               "property_directory".is_active
        FROM properties AS "property_directory", worker_gate AS bucket

  worker_tasks:
    auto_subscribe: true
    queries:
      # His tasks: assigned to him, or he's a member — not private; and his own private ones.
      - SELECT * FROM tasks WHERE is_private = false AND assigned_user_id IN worker_me
      - SELECT * FROM tasks WHERE is_private = false AND id IN (SELECT task_id FROM task_members WHERE user_id IN worker_me)
      - SELECT * FROM tasks WHERE is_private = true AND private_owner_id IN worker_me
      # Their members (and his own membership rows anywhere).
      - |
        SELECT task_members.task_id || ':' || task_members.user_id AS id,
               task_members.task_id, task_members.user_id, task_members.created_at
        FROM task_members WHERE task_members.user_id IN worker_me
      - |
        SELECT task_members.task_id || ':' || task_members.user_id AS id,
               task_members.task_id, task_members.user_id, task_members.created_at
        FROM task_members WHERE task_members.task_id IN (SELECT id FROM tasks WHERE is_private = false AND assigned_user_id IN worker_me)
      - |
        SELECT task_members.task_id || ':' || task_members.user_id AS id,
               task_members.task_id, task_members.user_id, task_members.created_at
        FROM task_members WHERE task_members.task_id IN (SELECT id FROM tasks WHERE is_private = false AND id IN (SELECT task_id FROM task_members WHERE user_id IN worker_me))
      - |
        SELECT task_members.task_id || ':' || task_members.user_id AS id,
               task_members.task_id, task_members.user_id, task_members.created_at
        FROM task_members WHERE task_members.task_id IN (SELECT id FROM tasks WHERE is_private = true AND private_owner_id IN worker_me)
      # Their comments.
      - SELECT * FROM task_comments WHERE task_is_private = false AND task_id IN (SELECT id FROM tasks WHERE assigned_user_id IN worker_me)
      - SELECT * FROM task_comments WHERE task_is_private = false AND task_id IN (SELECT task_id FROM task_members WHERE user_id IN worker_me)
      - SELECT * FROM task_comments WHERE task_is_private = true AND task_private_owner_id IN worker_me
      # Open reminders: his own, ones he set, and those on his tasks.
      - SELECT * FROM reminders WHERE status = 'pending' AND assigned_to IN worker_me
      - SELECT * FROM reminders WHERE status = 'pending' AND created_by IN worker_me
      - SELECT * FROM reminders WHERE status = 'pending' AND task_id IN (SELECT id FROM tasks WHERE is_private = false AND assigned_user_id IN worker_me)
      - SELECT * FROM reminders WHERE status = 'pending' AND task_id IN (SELECT id FROM tasks WHERE is_private = false AND id IN (SELECT task_id FROM task_members WHERE user_id IN worker_me))
      - SELECT * FROM reminders WHERE status = 'pending' AND task_id IN (SELECT id FROM tasks WHERE is_private = true AND private_owner_id IN worker_me)
      # His tasks' reminders already done (a far-off task stays on the board once one came).
      - SELECT * FROM reminders WHERE status = 'done' AND task_id IN (SELECT id FROM tasks WHERE is_private = false AND assigned_user_id IN worker_me)
      - SELECT * FROM reminders WHERE status = 'done' AND task_id IN (SELECT id FROM tasks WHERE is_private = false AND id IN (SELECT task_id FROM task_members WHERE user_id IN worker_me))
      - SELECT * FROM reminders WHERE status = 'done' AND task_id IN (SELECT id FROM tasks WHERE is_private = true AND private_owner_id IN worker_me)
      # His own snoozed tasks.
      - SELECT * FROM task_snoozes WHERE user_id IN worker_me
      # Documents on his tasks (the paperclip).
      - SELECT * FROM document_links WHERE entity_type = 'task' AND entity_id IN (SELECT id FROM tasks WHERE is_private = false AND assigned_user_id IN worker_me)
      - SELECT * FROM document_links WHERE entity_type = 'task' AND entity_id IN (SELECT id FROM tasks WHERE is_private = false AND id IN (SELECT task_id FROM task_members WHERE user_id IN worker_me))
      - SELECT * FROM document_links WHERE entity_type = 'task' AND entity_id IN (SELECT id FROM tasks WHERE is_private = true AND private_owner_id IN worker_me)
      # Projects he works on: his shifts', and his tasks' (worker_view_assigned_projects).
      - SELECT * FROM projects WHERE id IN (SELECT project_id FROM attendance_sessions WHERE user_id IN worker_me)
      - SELECT * FROM projects WHERE id IN (SELECT project_id FROM tasks WHERE is_private = false AND assigned_user_id IN worker_me)
      - SELECT * FROM projects WHERE id IN (SELECT project_id FROM tasks WHERE is_private = true AND private_owner_id IN worker_me AND assigned_user_id IN worker_me)

  worker_business:
    auto_subscribe: true
    queries:
      # Every customer (the owner's call, 2026-10-07 — the server lets workers read them all).
      - SELECT customers.* FROM customers, worker_gate AS bucket
      # The open orders (orders_worker_select_open), and his own delivery assignments.
      - |
        SELECT orders.* FROM orders, worker_gate AS bucket
        WHERE orders.status != 'delivered' AND orders.status != 'completed' AND orders.status != 'closed' AND orders.status != 'cancelled'
          AND orders.status != 'סופקה' AND orders.status != 'הושלמה' AND orders.status != 'סגורה' AND orders.status != 'בוטלה'
      - |
        SELECT order_delivery_recipients.order_id || ':' || order_delivery_recipients.user_id AS id,
               order_delivery_recipients.order_id, order_delivery_recipients.user_id,
               order_delivery_recipients.created_at
        FROM order_delivery_recipients WHERE order_delivery_recipients.user_id IN worker_me

  # The deliveries card — only for a worker whose deliveries section isn't switched off.
  worker_deliveries:
    auto_subscribe: true
    queries:
      - SELECT customer_branches.* FROM customer_branches, worker_deliveries_gate AS bucket
      - SELECT products.* FROM products, worker_deliveries_gate AS bucket
      - |
        SELECT order_items.* FROM order_items, worker_deliveries_gate AS bucket
        WHERE order_items.order_id IN (SELECT id FROM orders WHERE status != 'delivered' AND status != 'completed' AND status != 'closed' AND status != 'cancelled'
          AND status != 'סופקה' AND status != 'הושלמה' AND status != 'סגורה' AND status != 'בוטלה')
      - |
        SELECT payments.* FROM payments, worker_deliveries_gate AS bucket
        WHERE payments.order_id IN (SELECT id FROM orders WHERE status != 'closed' AND status != 'cancelled' AND status != 'סגורה' AND status != 'בוטלה')
